name: fuel_prices
version: "1.0.0"
config-version: 2

profile: fuel_prices

clean-targets:
  - target
  - dbt_packages

models:
  fuel_prices:
    staging:
      +materialized: view
    changes:
      +materialized: incremental
      +incremental_strategy: merge
      +unique_key: line_hash
    marts:
      +materialized: view

seeds:
  fuel_prices:
    provinces:
      +column_types:
        province_code: string
        province_name: string
        region_name: string
        area: string
        nuts3_code: string
        is_current: boolean
